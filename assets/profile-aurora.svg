<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title desc">
<title id="title">Adil Ali — Java Backend Developer</title>
<desc id="desc">A modern animated aurora banner with moving gradients, a subtle technical grid, and a pulsing network motif.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070b18"/><stop offset="55%" stop-color="#101a36"/><stop offset="100%" stop-color="#071c2c"/>
  </linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".82"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#2dd4bf;#22d3ee" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#6366f1" stop-opacity=".65"><animate attributeName="stop-color" values="#6366f1;#2dd4bf;#a78bfa;#6366f1" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#0f766e" stop-opacity=".1"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9fb7df" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="clip"><rect width="1200" height="390" rx="24"/></clipPath>
</defs>
<style>
  .title{font:800 62px 'Inter', 'Segoe UI', Arial, sans-serif;letter-spacing:-2.5px;fill:#f8fafc}
  .mono{font:500 14px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.2px;fill:#a5f3fc}
  .small{font:500 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px;fill:#a8b6d1}
  .orb{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
  .line{stroke-dasharray:7 10;animation:dash 22s linear infinite}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes dash{to{stroke-dashoffset:-340}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
  .drift{animation:drift 16s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.orb,.line,.drift{animation:none}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="390" fill="url(#base)"/>
  <rect width="1200" height="390" fill="url(#grid)"/>
  <ellipse cx="1000" cy="55" rx="310" ry="175" fill="#4338ca" opacity=".26" filter="url(#blur)" class="drift"/>
  <ellipse cx="900" cy="300" rx="330" ry="130" fill="#0d9488" opacity=".24" filter="url(#blur)" class="drift"/>
  <path d="M590 390C720 250 650 170 840 110S1070 30 1200 5V390Z" fill="url(#aurora)" opacity=".36"/>
  <path d="M610 390C750 275 710 190 875 145S1080 70 1200 28" fill="none" stroke="#67e8f9" stroke-opacity=".32" stroke-width="1.5" class="line"/>
  <path d="M700 390C825 285 795 230 930 190S1090 125 1200 94" fill="none" stroke="#a5b4fc" stroke-opacity=".35" stroke-width="1.5" class="line"/>
  <circle cx="955" cy="175" r="150" fill="url(#glow)" class="orb"/>
  <g stroke="#67e8f9" stroke-opacity=".5" fill="none">
    <path d="M820 95L915 145L1025 105L1090 185L1000 265L875 240L820 95" stroke-width="1.2"/>
    <path d="M915 145L900 215L1000 265M1025 105L1000 265" stroke-width="1"/>
  </g>
  <g fill="#a5f3fc">
    <circle cx="820" cy="95" r="3" class="orb"/><circle cx="915" cy="145" r="4" class="orb"/><circle cx="1025" cy="105" r="3" class="orb"/><circle cx="1090" cy="185" r="4" class="orb"/><circle cx="1000" cy="265" r="3.5" class="orb"/><circle cx="875" cy="240" r="3" class="orb"/><circle cx="900" cy="215" r="2.5" class="orb"/>
  </g>
  <rect x="58" y="58" width="5" height="220" rx="2" fill="#22d3ee"/>
  <text x="84" y="82" class="mono">JAVA BACKEND / SYSTEMS</text>
  <text x="80" y="157" class="title">Adil Ali</text>
  <text x="84" y="193" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#dbeafe">Building reliable backends.</text>
  <text x="84" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#dbeafe">Learning the systems behind them.</text>
  <g transform="translate(84 256)">
    <rect width="118" height="30" rx="15" fill="#0b2538" stroke="#155e75"/>
    <text x="59" y="19" text-anchor="middle" class="small" fill="#a5f3fc">SPRING BOOT</text>
    <rect x="128" width="74" height="30" rx="15" fill="#111c3a" stroke="#3730a3"/>
    <text x="165" y="19" text-anchor="middle" class="small" fill="#c7d2fe">DOCKER</text>
    <rect x="212" width="68" height="30" rx="15" fill="#102b2b" stroke="#0f766e"/>
    <text x="246" y="19" text-anchor="middle" class="small" fill="#99f6e4">KAFKA</text>
  </g>
  <text x="84" y="345" class="small">MCA STUDENT  /  JAVA  /  SQL  /  DISTRIBUTED SYSTEMS</text>
  <text x="1140" y="355" text-anchor="end" class="small" fill="#c4b5fd">PROFILE_001</text>
  <rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#94a3b8" stroke-opacity=".25"/>
</g>
</svg>