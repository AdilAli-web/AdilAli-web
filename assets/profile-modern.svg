<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Adil Ali — Java Backend Developer</title>
  <desc id="desc">A modern dark portfolio banner with cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d18"/><stop offset=".55" stop-color="#10172b"/><stop offset="1" stop-color="#17102a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#4f46e5" stop-opacity=".28"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="980" cy="120" rx="340" ry="230" fill="url(#glow)"/>
  <rect x="42" y="38" width="1116" height="284" rx="20" fill="none" stroke="#94a3b8" stroke-opacity=".17"/>
  <rect x="76" y="76" width="6" height="208" rx="3" fill="url(#accent)"/>
  <text x="108" y="106" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="4" fill="#67e8f9">JAVA BACKEND DEVELOPER</text>
  <text x="104" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-2" fill="#f8fafc">Adil Ali</text>
  <text x="108" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#cbd5e1">Building reliable APIs and learning how systems work.</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#e2e8f0">
    <rect x="108" y="244" width="118" height="30" rx="15" fill="#0891b2" fill-opacity=".16" stroke="#22d3ee" stroke-opacity=".5"/><text x="167" y="263" text-anchor="middle">Spring Boot</text>
    <rect x="238" y="244" width="82" height="30" rx="15" fill="#6366f1" fill-opacity=".16" stroke="#818cf8" stroke-opacity=".5"/><text x="279" y="263" text-anchor="middle">MySQL</text>
    <rect x="332" y="244" width="82" height="30" rx="15" fill="#6366f1" fill-opacity=".16" stroke="#818cf8" stroke-opacity=".5"/><text x="373" y="263" text-anchor="middle">Docker</text>
    <rect x="426" y="244" width="72" height="30" rx="15" fill="#a855f7" fill-opacity=".13" stroke="#c084fc" stroke-opacity=".5"/><text x="462" y="263" text-anchor="middle">Kafka</text>
  </g>
  <g transform="translate(875 100)">
