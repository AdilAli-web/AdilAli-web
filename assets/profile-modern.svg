    <circle cx="22" cy="22" r="4" fill="#22d3ee"/><circle cx="37" cy="22" r="4" fill="#818cf8"/><circle cx="52" cy="22" r="4" fill="#c084fc"/>
    <path d="M26 55h30m-30 22h60m-60 22h42m-42 22h74" stroke="#94a3b8" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
    <path d="M112 54l17 17-17 17m22 0h26" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="166" cy="112" r="17" fill="none" stroke="#22d3ee" stroke-opacity=".65"/><path d="M158 112l6 6 11-13" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M76 304H1124" stroke="url(#accent)" stroke-width="2" stroke-dasharray="2 8" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="7s" repeatCount="indefinite"/>
