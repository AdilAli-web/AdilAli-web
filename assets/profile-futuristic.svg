<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Adil Ali — Java Backend Developer</title>
<desc id="desc">Futuristic animated gradient banner with electric blue, violet, and magenta light trails.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b20"/><stop offset=".48" stop-color="#1a1045"/><stop offset="1" stop-color="#350d3b"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#7c3aed" stop-opacity=".7"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#b8c5ff" stroke-opacity=".1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="clip"><rect width="1200" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)"/>
 <ellipse cx="930" cy="110" rx="340" ry="190" fill="url(#orb)" filter="url(#blur)"/>
 <ellipse cx="1080" cy="350" rx="310" ry="170" fill="#ec4899" opacity=".14" filter="url(#blur)"/>
 <path d="M650 440L1030 -20M760 440L1140 -20M870 440L1250 -20" stroke="url(#neon)" stroke-width="2" opacity=".5"/>
 <path d="M640 390C770 270 800 150 950 110S1090 130 1230 10" stroke="url(#neon)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="10 18">
  <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="3s" repeatCount="indefinite"/>
 </path>
 <path d="M690 420C810 300 850 215 980 185S1120 180 1220 100" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity=".7" stroke-dasharray="3 14">
  <animate attributeName="stroke-dashoffset" from="0" to="68" dur="2.2s" repeatCount="indefinite"/>
 </path>
 <rect x="48" y="48" width="1104" height="324" rx="18" fill="none" stroke="#dbeafe" stroke-opacity=".22"/>
 <text x="82" y="99" font-family="monospace" font-size="14" letter-spacing="4" fill="#67e8f9">JAVA BACKEND DEVELOPER  //  MCA</text>
 <text x="76" y="192" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" letter-spacing="-4" fill="#ffffff">ADIL ALI<tspan fill="url(#neon)">.</tspan></text>
 <text x="83" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#dbeafe">Engineering the logic behind the interface.</text>
 <g font-family="monospace" font-size="12" font-weight="bold">
  <rect x="82" y="271" width="132" height="34" rx="17" fill="#06b6d4" fill-opacity=".16" stroke="#22d3ee"/><text x="148" y="292" text-anchor="middle" fill="#a5f3fc">SPRING BOOT</text>
  <rect x="226" y="271" width="94" height="34" rx="17" fill="#8b5cf6" fill-opacity=".18" stroke="#a78bfa"/><text x="273" y="292" text-anchor="middle" fill="#ddd6fe">MYSQL</text>
  <rect x="332" y="271" width="94" height="34" rx="17" fill="#ec4899" fill-opacity=".14" stroke="#f472b6"/><text x="379" y="292" text-anchor="middle" fill="#fbcfe8">DOCKER</text>
  <rect x="438" y="271" width="82" height="34" rx="17" fill="#4f46e5" fill-opacity=".18" stroke="#818cf8"/><text x="479" y="292" text-anchor="middle" fill="#c7d2fe">KAFKA</text>
 </g>
 <g transform="translate(855 125)">
  <circle cx="115" cy="80" r="90" fill="none" stroke="url(#neon)" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="5 9">
   <animateTransform attributeName="transform" type="rotate" from="0 115 80" to="360 115 80" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="80" r="65" fill="#0b102b" fill-opacity=".8" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M88 55L62 80l26 25M142 55l26 25-26 25M126 43l-22 74" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="115" cy="80" r="105" fill="none" stroke="#00e5ff" stroke-opacity=".25">
   <animate attributeName="r" values="96;112;96" dur="3s" repeatCount="indefinite"/>
  </circle>
 </g>
 <path d="M82 337H1118" stroke="url(#neon)" stroke-width="2"/>
 <circle cx="82" cy="337" r="4" fill="#00e5ff"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>
 <text x="82" y="357" font-family="monospace" font-size="10" letter-spacing="2" fill="#a5b4fc">BUILD  /  TEST  /  ITERATE  /  SHIP</text>
</g>
</svg>